{% extends "base.html" %}

{% block title %}Reset Password — LinkPulse{% endblock %}

{% block content %}
<div class="container auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">Enter your email and we'll generate a reset link.</p>
        </div>
        <form action="{{ url_for('auth.reset_password_request') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Generate Reset Link</button>
        </form>
        <div class="auth-footer">
            <p><a href="{{ url_for('auth.login') }}">Back to login</a></p>
        </div>
    </div>
</div>
{% endblock %}
