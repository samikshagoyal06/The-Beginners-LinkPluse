{% extends "base.html" %}

{% block title %}Sign in — LinkPulse{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                LinkPulse
            </div>
            <h1 class="auth-title">Sign in to your account</h1>
            <p class="auth-subtitle">Welcome back. Please enter your details.</p>
        </div>
        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-input" required autofocus autocomplete="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
        </form>
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
            <p><a href="{{ url_for('auth.reset_password_request') }}">Forgot password?</a></p>
        </div>
    </div>
</div>
{% endblock %}
