<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin — LinkPulse{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><path d='M30 65 L30 35 Q30 25 40 25 L60 25 Q70 25 70 35 L70 45' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/><path d='M30 35 L70 65' stroke='white' stroke-width='4' stroke-linecap='round'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
    <nav class="navbar admin-nav">
        <div class="nav-inner">
            <a href="{{ url_for('admin.dashboard') }}" class="nav-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                LinkPulse Admin
            </a>
            <div class="nav-links">
                <a href="{{ url_for('admin.dashboard') }}" class="nav-link">Dashboard</a>
                <a href="{{ url_for('admin.users') }}" class="nav-link">Users</a>
                <a href="{{ url_for('admin.links') }}" class="nav-link">Links</a>
                <a href="{{ url_for('admin.blocklist') }}" class="nav-link">Blocklist</a>
                <a href="{{ url_for('admin.audit_logs') }}" class="nav-link">Audit</a>
                <a href="{{ url_for('public.landing') }}" class="nav-link">Site</a>
            </div>
        </div>
    </nav>
    <main class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="container flash-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" role="alert">{{ message }}<button class="alert-close" onclick="this.parentElement.remove()">&times;</button></div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
