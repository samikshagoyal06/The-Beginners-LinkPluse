{% extends "base.html" %}

{% block title %}404 — Page Not Found{% endblock %}

{% block content %}
<div class="container error-page">
    <div class="error-card">
        <div class="error-icon">🔍</div>
        <h1 class="error-title">404 — Page Not Found</h1>
        <p class="error-message">The page you're looking for doesn't exist. It may have been moved or deleted.</p>
        <div class="error-actions">
            <a href="{{ url_for('landing') }}" class="btn btn-primary">Go Home</a>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">View Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
