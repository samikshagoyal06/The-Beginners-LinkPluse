{% extends "base.html" %}
{% block title %}New Campaign — LinkPulse{% endblock %}
{% block content %}
<div class="container dashboard-page">
    <div class="dashboard-header">
        <div>
            <h1 class="page-title">New Campaign</h1>
            <p class="page-description">Create a campaign to organize and group your links.</p>
        </div>
        <a href="{{ url_for('campaigns.list_campaigns') }}" class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back
        </a>
    </div>
    <div class="card">
        <form action="{{ url_for('campaigns.create_campaign') }}" method="POST">
            <div class="form-group">
                <label for="name" class="form-label">Campaign Name</label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="e.g., Summer Marketing 2025" autofocus>
                <p class="form-help">A descriptive name for this campaign</p>
            </div>
            <div class="form-group">
                <label for="description" class="form-label">Description <span class="optional">(optional)</span></label>
                <textarea id="description" name="description" class="form-textarea" rows="3" placeholder="What is this campaign for?"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Create Campaign
                </button>
                <a href="{{ url_for('campaigns.list_campaigns') }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
